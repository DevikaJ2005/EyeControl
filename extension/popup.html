<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>EyeControl Gaze Grid & Controller</title>
  <style>
    body {
      width: 320px;
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0B0F17;
      color: #FFFFFF;
      box-sizing: border-box;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255, 255, 255, 0.14);
      padding-bottom: 10px;
      margin-bottom: 12px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 800;
      font-size: 15px;
      color: #FFFFFF;
    }
    .brand-eye {
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .status-card {
      background-color: #161F2E;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 10px;
      padding: 10px 12px;
      margin-bottom: 12px;
      font-size: 12px;
    }
    .status-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 5px;
    }
    .status-label { color: #94A3B8; }
    .status-value { font-weight: 700; color: #FFFFFF; }
    .setting-group { margin-bottom: 10px; }
    .setting-label {
      font-size: 11px;
      font-weight: 700;
      color: #CBD5E1;
      margin-bottom: 4px;
      display: block;
    }
    select, input[type="range"] {
      width: 100%;
      padding: 7px;
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: #1E293B;
      color: #FFFFFF;
      font-size: 12px;
      box-sizing: border-box;
    }
    .toggle-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 8px;
      font-size: 12px;
      font-weight: 600;
      color: #E2E8F0;
    }
    .btn-action {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 10px;
      color: #FFFFFF;
      border: none;
      border-radius: 8px;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
      box-sizing: border-box;
      margin-top: 8px;
      transition: opacity 120ms ease;
    }
    .btn-action:hover { opacity: 0.9; }
    .btn-action.yt { background-color: #9C3822; }
    .btn-action.news { background-color: #1B3E6D; }
    .btn-action.app { background-color: #1A6B51; }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">
      <span class="brand-eye">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
          <circle cx="12" cy="12" r="9.5" stroke="#FFFFFF" stroke-width="2.4"/>
          <circle cx="12" cy="12" r="4" fill="#FFFFFF"/>
        </svg>
      </span>
      <span>EyeControl v1.1.0</span>
    </div>
    <span style="font-size: 10px; color: #22C55E; font-weight: 700;">● Camera on</span>
  </div>

  <div class="status-card">
    <div class="status-row">
      <span class="status-label">Stream Status:</span>
      <span class="status-value" id="bridge-status">Active</span>
    </div>
    <div class="status-row">
      <span class="status-label">Update Frequency:</span>
      <span class="status-value" id="hz-val">0 Hz</span>
    </div>
    <div class="status-row">
      <span class="status-label">Active Tab:</span>
      <span class="status-value" id="active-tab-val" style="max-width: 170px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">YouTube / India Today</span>
    </div>
  </div>

  <div class="setting-group">
    <label class="setting-label">Gaze Navigation Mode:</label>
    <select id="nav-mode-select">
      <option value="gaze-zone" selected>Gaze-Zone Scrolling (Top/Bottom Zones)</option>
      <option value="grid">Adaptive Grid Mode (3x3 Regions)</option>
      <option value="manual">Direct Gaze Pointer</option>
    </select>
  </div>

  <div class="setting-group">
    <label class="setting-label">Dwell Selection Speed:</label>
    <select id="dwell-duration-select">
      <option value="600">Fast (600 ms)</option>
      <option value="800" selected>Standard (800 ms)</option>
      <option value="1200">Comfortable (1.2 s)</option>
      <option value="1600">Relaxed (1.6 s)</option>
    </select>
  </div>

  <div class="toggle-row">
    <span>Debug Mode (Show Grid & HUD)</span>
    <input type="checkbox" id="debug-mode-check">
  </div>

  <div class="toggle-row">
    <span>Magnetic Snapping</span>
    <input type="checkbox" id="magnetic-snap-check" checked>
  </div>

  <div class="toggle-row">
    <span>Audio Feedback Chime</span>
    <input type="checkbox" id="sound-feedback-check" checked>
  </div>

  <div style="margin-top: 14px;">
    <a href="https://www.youtube.com" target="_blank" class="btn-action yt">Launch YouTube</a>
    <a href="https://www.indiatoday.in" target="_blank" class="btn-action news">Launch India Today</a>
    <a href="http://localhost:5173" target="_blank" class="btn-action app">Open EyeControl App</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
